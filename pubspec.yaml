name: boilerplate
description: A flutter boilerplate project created using MobX and Provider.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# Read more about versioning at semver.org.
version: 1.0.0+1

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # A
  another_flushbar: ^2.2.4
  # B
  # C
  crypto: ^3.0.6
  cupertino_icons: ^1.0.5
  # D
  dart_jsonwebtoken: ^3.4.1
  device_info_plus: ^10.0.0
  dio: ^5.1.1
  # F
  flutter_animate: ^4.5.2
  flutter_mobx: ^2.0.6+5
  # G
  get_it: ^9.2.1
  # I
  intl: ^0.20.2
  # J
  # K
  # L
  # M
  mobx: ^2.1.4
  # N
  # O
  # P
  package_info_plus: ^8.0.0
  path_provider: ^2.0.14
  # Q
  # R
  # S
  flutter_secure_storage: ^9.0.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.1.0
  sembast_web: ^2.1.3
  sembast: ^3.4.4
  # T
  # U
  # V
  validators: ^3.0.0
  # W
  # X
  xxtea: ^2.1.0
  # Y
  # Z

  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The following adds the launcher icon support to your application.
  # run below mentioned commands to generate launcher icons
  # flutter packages get
  # flutter packages pub run flutter_launcher_icons:main
  flutter_launcher_icons: ^0.14.4
  # The following adds the native splash screen support
  # run: flutter pub run flutter_native_splash:create
  # then: flutter pub run flutter_native_splash:create --undo to undo
  flutter_native_splash: ^2.4.4
  mobx_codegen: ^2.2.0
  build_runner: ^2.3.3
  json_serializable: ^6.6.1
  flutter_lints: ^6.0.0

flutter_icons:
  image_path: "assets/icons/ic_launcher.png"
  android: true
  ios: true

# Native splash screen configuration
# run: flutter pub run flutter_native_splash:create
flutter_native_splash:
  image: assets/icons/ic_launcher.png
  color: "#FFFFFF"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lang/

  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/Product-Sans-Regular.ttf
        - asset: assets/fonts/Product-Sans-Italic.ttf
          style: italic
        - asset: assets/fonts/Product-Sans-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/oswald/Oswald-Medium.ttf
          weight: 500
        - asset: assets/fonts/oswald/Oswald-SemiBold.ttf
          weight: 600
